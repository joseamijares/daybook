name: Windows release

# A windows-v* tag builds Daybook for Windows (windows/, Tauri) and attaches its
# installers to that tag's GitHub release: Daybook-setup.exe (per user, no admin)
# and Daybook.msi, never marked Latest (that's the Mac app's). They aren't code-signed yet, so SmartScreen warns the first
# time and the release notes say how to open it. Pull requests that touch the
# app or the pages build it too, as a workflow artifact.

on:
  push:
    tags: ['windows-v*']
  pull_request:
    paths:
      - 'windows/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'next.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # .npmrc's shell-emulator sets DAYBOOK_DEVICE=windows in cmd.exe as well.
      - name: Build the pages
        run: pnpm build:windows
        env:
          DAYBOOK_LOCALE: ''
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Build the app
        working-directory: windows
        run: cargo tauri build
      - name: Collect the installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          cp windows/target/release/bundle/nsis/*.exe dist/Daybook-setup.exe
          cp windows/target/release/bundle/msi/*.msi dist/Daybook.msi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: Daybook-windows
          path: dist
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/windows-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Daybook-windows
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<'MD'
          **Install**
          1. Download `Daybook-setup.exe` and open it. It installs for you alone, no administrator needed. (`Daybook.msi` is the same app for IT-managed PCs.)
          2. This build isn't code-signed yet, so Windows SmartScreen says it "protected your PC". Choose **More info**, then **Run anyway**.
          3. Daybook opens on this PC: your days live here, inside Daybook. Closing the window keeps it in the tray, by the clock; right-click its icon to quit.

          Updating? Install the new one over it. Your days stay.
          MD
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # Never "Latest": the Mac app updates from releases/latest/download/appcast.xml,
            # and the README links releases/latest/download/Daybook.dmg.
            gh release create "$TAG" dist/* --title "Daybook for Windows ${TAG#windows-v}" --notes-file "$notes" --latest=false
          fi
