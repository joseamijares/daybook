name: Windows release

# A windows-v* tag builds Daybook for Windows (windows/, Tauri) and attaches its
# installers to that tag's GitHub release: Daybook-setup.exe (per user, no admin)
# and Daybook.msi, never marked Latest (that's the Mac app's). With the ESIGNER_*
# secrets (windows/README.md, Signing) the app and both installers are code-signed;
# without them they aren't, SmartScreen says "unknown publisher", and the release
# notes say how to open it. Pull requests that touch the app or the pages build it
# too, unsigned, as a workflow artifact.

on:
  push:
    tags: ['windows-v*']
  pull_request:
    paths:
      - 'windows/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'next.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.signing.outputs.enabled == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # .npmrc's shell-emulator sets DAYBOOK_DEVICE=windows in cmd.exe as well.
      - name: Build the pages
        run: pnpm build:windows
        env:
          DAYBOOK_LOCALE: ''
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: cargo install tauri-cli --version "^2" --locked
      # Releases are signed when the eSigner secrets are set (windows/README.md,
      # Signing); pull requests never are, so they spend no signings and see no secrets.
      - name: Check for a signing certificate
        id: signing
        shell: bash
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/windows-v* && -n "$ESIGNER_USERNAME" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/windows-v* ]]; then
            echo "::warning title=Not signed::The ESIGNER_* secrets aren't set, so SmartScreen will say \"unknown publisher\". See Signing in windows/README.md."
          fi
      - name: Get CodeSignTool
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'CodeSignTool.zip'
          Invoke-WebRequest -Uri 'https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip' -OutFile $zip
          # v1.3.2's published zip; a different file stops the release here.
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '4afc32e8b7f79bbe1de7e4e7049aaad4e0f754357613b9bbec0e3052f06fd36b') {
            throw 'The CodeSignTool download is not the one this workflow was written for.'
          }
          $dir = Join-Path $env:RUNNER_TEMP 'CodeSignTool'
          Expand-Archive $zip -DestinationPath $dir
          "CODE_SIGN_TOOL_PATH=$dir" >> $env:GITHUB_ENV
      - name: Build the app
        working-directory: windows
        shell: pwsh
        env:
          SIGN: ${{ steps.signing.outputs.enabled }}
          ESIGNER_USERNAME: ${{ steps.signing.outputs.enabled == 'true' && secrets.ESIGNER_USERNAME || '' }}
          ESIGNER_PASSWORD: ${{ steps.signing.outputs.enabled == 'true' && secrets.ESIGNER_PASSWORD || '' }}
          ESIGNER_CREDENTIAL_ID: ${{ steps.signing.outputs.enabled == 'true' && secrets.ESIGNER_CREDENTIAL_ID || '' }}
          ESIGNER_TOTP_SECRET: ${{ steps.signing.outputs.enabled == 'true' && secrets.ESIGNER_TOTP_SECRET || '' }}
        run: |
          if ($env:SIGN -eq 'true') {
            # Tauri signs the app, the uninstaller and both installers with scripts/sign.ps1.
            $sign = Join-Path $env:GITHUB_WORKSPACE 'windows\scripts\sign.ps1'
            $config = @{ bundle = @{ windows = @{ signCommand = @{ cmd = 'powershell'; args = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $sign, '%1') } } } }
            $file = Join-Path $env:RUNNER_TEMP 'signing.json'
            $config | ConvertTo-Json -Depth 8 | Set-Content -Path $file -Encoding utf8
            cargo tauri build --config $file
          } else {
            cargo tauri build
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect the installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          cp windows/target/release/bundle/nsis/*.exe dist/Daybook-setup.exe
          cp windows/target/release/bundle/msi/*.msi dist/Daybook.msi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: Daybook-windows
          path: dist
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/windows-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Daybook-windows
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<'MD'
          **Install**
          1. Download `Daybook-setup.exe` and open it. It installs for you alone, no administrator needed. (`Daybook.msi` is the same app for IT-managed PCs.)
          MD
          if [ "$SIGNED" = true ]; then
            cat >> "$notes" <<'MD'
          2. It's code-signed. While it's new, Windows SmartScreen may still say it "protected your PC"; choose **More info**, check the publisher, then **Run anyway**. That fades as more people install it.
          MD
          else
            cat >> "$notes" <<'MD'
          2. This build isn't code-signed, so Windows SmartScreen says it "protected your PC" from an unknown publisher. Choose **More info**, then **Run anyway**.
          MD
          fi
          cat >> "$notes" <<'MD'
          3. Daybook opens on this PC: your days live here, inside Daybook. Closing the window keeps it in the tray, by the clock; right-click its icon to quit.

          Updating? Install the new one over it. Your days stay.
          MD
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # Never "Latest": the Mac app updates from releases/latest/download/appcast.xml,
            # and the README links releases/latest/download/Daybook.dmg.
            gh release create "$TAG" dist/* --title "Daybook for Windows ${TAG#windows-v}" --notes-file "$notes" --latest=false
          fi
