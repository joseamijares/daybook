name: Mac release

# A mac-v* tag builds Daybook.dmg with mac/scripts/package-dmg.sh and attaches it
# to that tag's GitHub release. With the Developer ID and notary secrets (see
# mac/README.md) the image is signed, notarized and stapled; without them it's
# ad-hoc signed and the release notes say how to open it. Pull requests that
# touch mac/ build it too, ad-hoc and without secrets, as a workflow artifact.

on:
  push:
    tags: ['mac-v*']
  pull_request:
    paths:
      - 'mac/**'
      - '.github/workflows/mac-release.yml'

permissions:
  contents: read

concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90 # notarizing usually takes minutes, but can take much longer
    outputs:
      macos: ${{ steps.version.outputs.macos }}
      signing: ${{ steps.dmg.outputs.signing }}
      sha256: ${{ steps.dmg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^MARKETING_VERSION = //p' mac/Config/Shared.xcconfig)
          macos=$(sed -n 's/^MACOSX_DEPLOYMENT_TARGET = //p' mac/Config/Shared.xcconfig)
          echo "macos=${macos%.0}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag_version=${GITHUB_REF_NAME#mac-v}
            if [ "${tag_version%%-*}" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $version in mac/Config/Shared.xcconfig."
              exit 1
            fi
          fi
          xcodebuild -version

      # Only tag builds see the secrets. Nothing here prints them: the .p12 and .p8
      # go to files in RUNNER_TEMP, and the keychain password is random and masked.
      - name: Set up signing
        id: signing
        if: startsWith(github.ref, 'refs/tags/mac-v')
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$DEVELOPER_ID_P12" ] || [ -z "$DEVELOPER_ID_P12_PASSWORD" ]; then
            echo "::warning title=Not notarized::DEVELOPER_ID_P12 and DEVELOPER_ID_P12_PASSWORD aren't set, so this build is ad-hoc signed and the release notes say how to open it."
            exit 0
          fi

          keychain="$RUNNER_TEMP/daybook-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          umask 077
          printf '%s' "$DEVELOPER_ID_P12" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Lets codesign use the key without a prompt nobody is there to answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error::DEVELOPER_ID_P12 holds no valid Developer ID Application certificate with its private key."
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

          if [ -n "$NOTARY_KEY_P8" ] && [ -n "$NOTARY_KEY_ID" ]; then
            printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
            echo "notary=api-key" >> "$GITHUB_OUTPUT"
            echo "notary-key=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_OUTPUT"
          elif [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then
            echo "notary=apple-id" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Not notarized::Signing with a Developer ID, but there are no notary secrets (NOTARY_KEY_P8 and NOTARY_KEY_ID, or NOTARY_APPLE_ID, NOTARY_PASSWORD and NOTARY_TEAM_ID), so macOS will still warn and the release notes say how to open it."
          fi

      - name: Build the disk image
        id: dmg
        env:
          DEVELOPER_ID: ${{ steps.signing.outputs.identity }}
          NOTARY_KEY: ${{ steps.signing.outputs.notary-key }}
          NOTARY_KEY_ID: ${{ steps.signing.outputs.notary == 'api-key' && secrets.NOTARY_KEY_ID || '' }}
          NOTARY_ISSUER: ${{ steps.signing.outputs.notary == 'api-key' && secrets.NOTARY_ISSUER || '' }}
          NOTARY_APPLE_ID: ${{ steps.signing.outputs.notary == 'apple-id' && secrets.NOTARY_APPLE_ID || '' }}
          NOTARY_PASSWORD: ${{ steps.signing.outputs.notary == 'apple-id' && secrets.NOTARY_PASSWORD || '' }}
          NOTARY_TEAM_ID: ${{ steps.signing.outputs.notary == 'apple-id' && secrets.NOTARY_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          mac/scripts/package-dmg.sh
          if [ -n "$NOTARY_KEY$NOTARY_APPLE_ID" ]; then
            signing=notarized
          elif [ -n "$DEVELOPER_ID" ]; then
            signing=developer-id
          else
            signing=ad-hoc
          fi
          sha256=$(shasum -a 256 mac/build/Daybook.dmg | cut -d ' ' -f 1)
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Daybook.dmg: $signing, SHA-256 \`$sha256\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the notarization
        if: steps.dmg.outputs.signing == 'notarized'
        run: |
          set -euo pipefail
          xcrun stapler validate mac/build/Daybook.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 mac/build/Daybook.dmg

      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary-key.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: Daybook-dmg
          path: mac/build/Daybook.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/mac-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Daybook-dmg
          path: dist

      # The workflow owns the block between the mac-release markers: it writes it
      # into a new release, replaces it on a re-run, and appends it to notes that
      # were written by hand. Write "What's new" above it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          MIN_MACOS: ${{ needs.build.outputs.macos }}
          SIGNING: ${{ needs.build.outputs.signing }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          run_url="$repo_url/actions/runs/$GITHUB_RUN_ID"
          deploy_url="https://vercel.com/new/clone?repository-url=$(jq -rn --arg u "$repo_url" '$u | @uri')"
          case "$SIGNING" in
            notarized) how='signed with a Developer ID, notarized and stapled' ;;
            developer-id) how='signed with a Developer ID but not notarized (no notary secrets set)' ;;
            *) how='ad-hoc signed (no Developer ID secrets set)' ;;
          esac

          section="$RUNNER_TEMP/section.md"
          cat > "$section" <<'MD'
          <!-- mac-release:start -->
          **Install**
          1. Download `Daybook.dmg` and open it.
          2. Drag Daybook into Applications.
          MD
          if [ "$SIGNING" = notarized ]; then
            cat >> "$section" <<'MD'
          3. Open it. It's signed with a Developer ID and notarized by Apple, so it opens like any other app.
          MD
            update='Updating? Quit Daybook and drag the new one into Applications to replace it.'
          else
            cat >> "$section" <<'MD'
          3. Open it. This build isn't notarized by Apple, so the first time macOS says it "could not verify" Daybook and offers only **Done** and **Move to Trash**:
             - Choose **Done** (not Move to Trash).
             - Open **System Settings → Privacy & Security**, scroll to the bottom and choose **Open Anyway**, then **Open** (it may ask for your password).
             - Or, in Terminal: `xattr -dr com.apple.quarantine /Applications/Daybook.app`, then open Daybook as usual.
          MD
            update='Updating? Quit Daybook, drag the new one into Applications to replace it, and do step 3 once more.'
          fi
          cat >> "$section" <<MD
          4. Paste your Daybook's address and key (Settings → AI agents → Daybook for Mac → Create token, or your \`DAYBOOK_KEY\`).

          $update

          Requires macOS $MIN_MACOS or later; universal (Apple silicon and Intel). Needs a Daybook in the cloud ([deploy your own]($deploy_url)).

          Built by the [Mac release workflow]($run_url) from ${GITHUB_SHA:0:7}: $how.
          SHA-256: \`$SHA256\`
          <!-- mac-release:end -->
          MD

          body="$RUNNER_TEMP/body.md"
          notes="$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" --json body --jq '.body // ""' > "$body" 2> /dev/null; then
            gh release upload "$TAG" dist/Daybook.dmg --clobber
            if grep -q '<!-- mac-release:start -->' "$body"; then
              awk -v section="$section" '
                /<!-- mac-release:start -->/ { while ((getline line < section) > 0) print line; skip = 1; next }
                /<!-- mac-release:end -->/ { skip = 0; next }
                !skip { print }
              ' "$body" > "$notes"
            elif grep -q '[^[:space:]]' "$body"; then
              { cat "$body"; echo; cat "$section"; } > "$notes"
            else
              cp "$section" "$notes"
            fi
            gh release edit "$TAG" --notes-file "$notes"
          else
            version=${TAG#mac-v}
            prerelease=
            case "$version" in *-*) prerelease=yes ;; esac
            gh release create "$TAG" dist/Daybook.dmg --verify-tag --title "Daybook for Mac $version" \
              --notes-file "$section" ${prerelease:+--prerelease}
          fi
          echo "Published $repo_url/releases/tag/$TAG ($SIGNING)" >> "$GITHUB_STEP_SUMMARY"
