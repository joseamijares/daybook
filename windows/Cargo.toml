[package]
name = "daybook"
version = "0.1.0"
description = "Daybook for Windows: the Daybook pages on this PC, with their own days."
license = "MIT"
repository = "https://github.com/joseamijares/daybook"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
sys-locale = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
